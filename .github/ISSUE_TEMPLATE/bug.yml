name: Bug report
description: Report a reproducible defect without disclosing sensitive data
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include documents, credentials, cookies, provider keys, or vulnerability details. Use SECURITY.md for sensitive reports.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic documents and sanitized logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, runtime, database, and local/Compose mode.
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Regression test
      description: Describe the automated check that should prevent recurrence.
