name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, type, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy app

      - name: Test
        run: python -m pytest

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  platform:
    name: Compose and secret checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet

      - name: Scan repository for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          zricethezav/gitleaks:v8.21.2
          detect --source=/repo --redact --verbose

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - platform
    strategy:
      fail-fast: false
      matrix:
        component:
          - backend
          - frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image without pushing
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: false
          tags: enterprise-rag-assistant-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  compose-smoke:
    name: PostgreSQL end-to-end smoke
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - platform
    env:
      POSTGRES_PASSWORD: ci-only-database-password-not-a-production-secret
      RAG_JWT_SECRET: ci-only-jwt-secret-not-valid-outside-this-run
      VITE_API_BASE_URL: /api/v1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install smoke client
        run: python -m pip install httpx==0.28.1

      - name: Start healthy application
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Exercise registration, ingestion, retrieval, citations, and isolation
        env:
          RAG_SMOKE_API_URL: http://localhost:3000/api/v1
        run: python scripts/smoke_test.py

      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop application
        if: always()
        run: docker compose down --volumes
